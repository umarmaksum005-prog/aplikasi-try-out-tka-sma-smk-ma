        const renderMath = () => {
            setTimeout(() => {
                if (window.renderMathInElement) {

                        delimiters: [

        };
        const generateDays = () => Array.from({ length: 31 }, (_, i) => i + 1);
        const generateMonths = () => ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        const generateYears = () => {
            const currentYear = new Date().getFullYear();
            return Array.from({ length: 30 }, (_, i) => currentYear - 10 - i);
        };

        // Skala hasil TKA jenjang SMA/MA/sederajat dan SMK/MAK:
        // 200,00 sampai 800,00.
        // Catatan: konversi di aplikasi ini adalah KONVERSI SIMULASI tryout
        // dari persentase jawaban benar, bukan penskoran TKA nasional berbasis
        // pengolahan/skalasi resmi.
        const TKA_SCORE_MIN = 200;
        const TKA_SCORE_MAX = 800;
        const TKA_ISTIMEWA_MIN = 725;

        const convertRawPercentToTkaScore = (percent) => {
            const p = Math.max(0, Math.min(100, Number(percent) || 0));
            const score = TKA_SCORE_MIN + ((TKA_SCORE_MAX - TKA_SCORE_MIN) * p / 100);
            return Number(score.toFixed(2));
        };

        // Kepmendikdasmen No. 56 Tahun 2026 menetapkan kategori capaian
        // Baik, Memadai, dan Kurang, serta predikat Istimewa >= 725,00.
        // Regulasi tidak memberikan batas numerik sederhana untuk tiga kategori
        // tersebut. Untuk TRYOUT, aplikasi memakai batas operasional berikut
        // agar kategori dapat ditampilkan dan dapat diubah kemudian tanpa
        // mengklaimnya sebagai batas resmi TKA nasional.
        const getScoreCategory = (score) => {
            const nilai = Math.max(TKA_SCORE_MIN, Math.min(TKA_SCORE_MAX, Number(score) || TKA_SCORE_MIN));
            if (nilai >= TKA_ISTIMEWA_MIN) return "Istimewa";
            if (nilai >= 600) return "Baik";
            if (nilai >= 400) return "Memadai";
            return "Kurang";
        };
        
        const shuffleArray = (array) => {
            if (!array) return [];
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const downloadExcel = (data, title = "Rekap") => {
           if (!data || data.length === 0) {
                alert("Belum ada data nilai untuk diunduh.");
                return;
            }
            let tableHTML = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"></head>
                <body>
                <table border="1" style="border-collapse: collapse;">
                <thead>

                    <th style="padding: 10px;">No</th>
                    <th>Nama Murid</th>
                    <th>Asal Sekolah</th>
                    <th>Kabupaten/Kota</th>
                    <th>Provinsi</th>
                    <th>NISN</th>
                    <th>Jenis Kelamin</th>
                    <th>Tempat Lahir</th>
                    <th>Tanggal Lahir</th>
                    <th>Jawaban Benar</th>
                    <th>Total Soal</th>
                    <th>Nilai Akhir</th>
                    <th>Kategori</th>
                    </tr>
                </thead>
                <tbody>
            `;
            data.forEach((item, index) => {
                const scoreFixed = (item.score !== null && item.score !== undefined && item.score !== "" && !isNaN(Number(item.score))) ? Number(item.score).toFixed(2).replace(".", ",") : "0,00";
                const category = getScoreCategory(item.score || 0);
                const categoryColor = category === "Istimewa" ? "#d1fae5" : category === "Baik" ? "#dbeafe" : category === "Memadai" ? "#fef3c7" : "#fee2e2";
                
                const tglLahir = (item.birthDate && item.birthMonth && item.birthYear) 
                    ? `${item.birthDate} ${item.birthMonth} ${item.birthYear}` 
                    : "-";

                tableHTML += `<tr>
                    <td style="text-align: center;">${index + 1}</td>
                    <td>${item.studentName || item.fullName ||item.name || '-'}</td>
                    <td>${item.school || '-'}</td>
                    <td>${item.regency || '-'}</td>
                    <td>${item.province || '-'}</td>
                    <td style="text-align: center; mso-number-format:'\@';">${item.nisn || '-'}</td>
                    <td style="text-align: center;">${item.gender || '-'}</td>
                    <td>${item.birthPlace || '-'}</td>
                    <td>${tglLahir}</td> 
                    <td style="text-align: center;">${item.correctCount || 0}</td>
                    <td style="text-align: center;">${item.totalQuestions || 0}</td>
                    <td style="text-align: center; font-weight: bold; mso-number-format:'0.00';">${scoreFixed}</td>
                    <td style="text-align: center; background-color: ${categoryColor};">${category}</td>
                </tr>`;
            });
            tableHTML += `</tbody></table></body></html>`;
            const blob = new Blob([tableHTML], { type: 'application/vnd.ms-excel' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            const safeTitle = title.replace(/[/\\?%*:|"<>]/g, '-');
            link.download = `Nilai_${safeTitle}_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // ============================================================
        // UNDUH ANALISIS HASIL NILAI PER BUTIR SOAL
        // ============================================================
        const downloadAnalysis = (data, title = "Analisis_Hasil_Nilai") => {
            if (!Array.isArray(data) || data.length === 0) { alert("Belum ada data nilai untuk dianalisis."); return; }
            const hasDetail = data.some(r => Array.isArray(r.questionAnalysis) && r.questionAnalysis.length);
            if (!hasDetail) { alert("Data nilai lama belum menyimpan rincian jawaban per soal. Analisis per butir tersedia untuk hasil yang dikerjakan setelah fitur ini diperbarui."); return; }
            const map = {};
            data.forEach(result => (result.questionAnalysis || []).forEach(item => {
                const key = String(item.questionId ?? item.questionNo ?? '');
                if (!map[key]) map[key] = { no:item.questionNo || Object.keys(map).length+1, subject:item.subject||'-', title:item.examTitle||result.examTitle||'-', type:item.questionForm||'-', competency:item.competency||'-', subcompetency:item.subcompetency||'-', material:item.element||'-', submaterial:item.subelement||'-', coverage:item.coverage||item.cakupanSubelemen||'-', cognitive:item.cognitiveLevel||'-', thinking:item.thinkingProcess||'-', participants:0, correct:0, wrong:0, blank:0 };
                const a=map[key]; a.participants++;
                if(item.status==='correct' || item.isCorrect===true) a.correct++; else if(item.status==='blank') a.blank++; else a.wrong++;
            }));
            const rows=Object.values(map).sort((a,b)=>Number(a.no)-Number(b.no));
            const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            const interpretation=p=>p>=80?'Sangat tinggi':p>=60?'Tinggi':p>=40?'Sedang':'Rendah';
            let html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>table{border-collapse:collapse}th,td{border:1px solid #777;padding:5px;vertical-align:top}th{background:#dbeafe;font-weight:bold}.title{font-size:16pt;font-weight:bold}</style></head><body>';
            const subjectsInAnalysis = [...new Set(data.flatMap(r => (r.questionAnalysis || []).map(item => item.subject).filter(Boolean)))];
            const analysisBasis = subjectsInAnalysis.length === 1 && subjectsInAnalysis[0] === 'Matematika'
                ? 'metadata butir Matematika mencakup Materi/Elemen, Submateri/Sub-elemen, Cakupan Sub-elemen, Kompetensi, Level Kognitif, dan Proses Berpikir.'
                : subjectsInAnalysis.length === 1 && subjectsInAnalysis[0] === 'Bahasa Indonesia'
                    ? 'metadata butir Bahasa Indonesia mencakup Materi/Elemen, Subkompetensi, Kompetensi, Level Kognitif, dan Proses Berpikir. Cakupan Sub-elemen Matematika tidak digunakan.'
                    : 'metadata butir disesuaikan dengan mata pelajaran masing-masing; Cakupan Sub-elemen digunakan untuk Matematika, sedangkan Bahasa Indonesia menggunakan Subkompetensi.';
            html+=`<p class="title">ANALISIS HASIL NILAI PER BUTIR SOAL</p><p><b>Judul:</b> ${esc(title)} &nbsp; <b>Jumlah Peserta:</b> ${data.length}</p><p><b>Dasar analisis:</b> ${esc(analysisBasis)}</p>`;
            html+='<table><thead><tr><th>No</th><th>Mata Pelajaran</th><th>Judul Soal</th><th>Bentuk Soal</th><th>Kompetensi</th><th>Subkompetensi</th><th>Materi/Elemen</th><th>Submateri/Sub-elemen</th><th>Cakupan Sub-elemen</th><th>Level Kognitif</th><th>Proses Berpikir</th><th>Peserta</th><th>Benar</th><th>Salah</th><th>Kosong</th><th>% Benar</th><th>Interpretasi</th></tr></thead><tbody>';
            rows.forEach(a=>{const pct=a.participants?a.correct/a.participants*100:0; html+=`<tr><td>${esc(a.no)}</td><td>${esc(a.subject)}</td><td>${esc(a.title)}</td><td>${esc(a.type)}</td><td>${esc(a.competency)}</td><td>${esc(a.subcompetency)}</td><td>${esc(a.material)}</td><td>${esc(a.submaterial)}</td><td>${esc(a.coverage)}</td><td>${esc(a.cognitive)}</td><td>${esc(a.thinking)}</td><td>${a.participants}</td><td>${a.correct}</td><td>${a.wrong}</td><td>${a.blank}</td><td>${pct.toFixed(2)}%</td><td>${interpretation(pct)}</td></tr>`;});
            html+='</tbody></table></body></html>';
            const blob=new Blob([html],{type:'application/vnd.ms-excel'}), url=URL.createObjectURL(blob), link=document.createElement('a'); link.href=url;
            const safeTitle=String(title||'Analisis_Hasil_Nilai').replace(/[/\\?%*:|"<>]/g,'-'); link.download=`Analisis_Hasil_Nilai_${safeTitle}_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link); setTimeout(()=>URL.revokeObjectURL(url),1000);
        };

        // ============================================================
        // UNDUH WORD: NASKAH SOAL + KISI-KISI TKA SMA/SMK
        // Format .DOC kompatibel dengan Microsoft Word.
        // Kisi-kisi mengikuti istilah pada Perkaban BSKAP No. 047/H/AN/2025:
        // Mapel, jenis soal, bentuk soal, materi/elemen, submateri/sub-elemen,
        // kompetensi, subkompetensi, level kognitif, dan proses berpikir.
        // ============================================================
        const wordEscape = (value) => String(value ?? '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
            .replace(/'/g,'&#39;');

        const wordPlain = (value) => String(value ?? '')
            .replace(/<br\s*\/?>/gi,'\n')
            .replace(/<[^>]*>/g,'')
            .trim();

        const getQuestionSubject = (q) => q?.subject || 'Matematika';
        const getQuestionTitle = (q) => String(q?.examTitle || 'Tanpa Judul').trim() || 'Tanpa Judul';

        const getWordQuestionType = (q) => {
            if (q?.itemType) return q.itemType;
            if (q?.groupId) return 'Grup';
            return 'Tunggal';
        };

        const getWordForm = (q) => {
            if (q?.questionForm) return q.questionForm;
            if (q?.type === 'complex') return 'PGK - MCMA';
            if (q?.type === 'statement') return 'PGK - Kategori';
            return 'Pilihan Ganda Sederhana';
        };

        const getWordMaterial = (q) => {
            if (getQuestionSubject(q) === 'Bahasa Indonesia') {
                if (q?.contentType === 'fiksi') return 'Keterampilan Membaca - Teks Fiksi';
                if (q?.contentType === 'informasi') return 'Keterampilan Membaca - Teks Informasi';
                return q?.element || 'Keterampilan Membaca';
            }
            return q?.element || 'Belum diisi';
        };

        const getWordSubmaterial = (q) => {
            if (q?.subelement) return q.subelement;
            if (q?.subcompetency) return q.subcompetency;
            return 'Belum diisi';
        };

        const getWordCompetency = (q) => q?.competency || 'Belum diisi';
        const getWordSubcompetency = (q) => q?.subcompetency || 'Belum diisi';
        const getWordCognitive = (q) => q?.cognitiveLevel || 'Belum diisi';
        const getWordThinking = (q) => q?.thinkingProcess || 'Belum diisi';

        const questionToWordHtml = (q, no) => {
            const options = Array.isArray(q?.options) ? q.options : [];
            const statements = Array.isArray(q?.statements) ? q.statements : [];
            let body = `<div class="question">
                <h3>Soal ${no}</h3>
                <p><b>Mata Pelajaran:</b> ${wordEscape(getQuestionSubject(q))}</p>
                <p><b>Judul Soal:</b> ${wordEscape(getQuestionTitle(q))}</p>`;
            if (q?.stimulus) {
                body += `<div class="stimulus"><b>Stimulus${q.stimulusTitle ? ': ' + wordEscape(q.stimulusTitle) : ''}</b><p>${wordEscape(wordPlain(q.stimulus)).replace(/\n/g,'<br/>')}</p></div>`;
            }
            if (q?.image) {
                body += `<p><img src="${q.image}" alt="${wordEscape(q.imageAlt || 'Gambar pendukung soal')}" style="max-width:520px;max-height:320px;"/></p>`;
            }
            body += `<p class="question-text">${wordEscape(wordPlain(q.text)).replace(/\n/g,'<br/>')}</p>`;

            if (options.length) {
                body += `<div class="options">`;
                options.forEach((o,i) => {
                    const img = q.optionImages?.[i] ? `<br/><img src="${q.optionImages[i]}" style="max-width:240px;max-height:150px;"/>` : '';
                    // Bersihkan awalan nomor/abjad yang mungkin sudah tersimpan pada teks opsi,
                    // lalu tampilkan hanya satu abjad A, B, C, D.
                    const cleanOption = wordPlain(o).replace(/^\s*(?:[A-Da-d]|[1-4])\s*[.)-]\s*/,'');
                    body += `<div class="option-item"><span class="option-letter">${String.fromCharCode(65+i)}.</span> ${wordEscape(cleanOption).replace(/\n/g,'<br/>')}${img}</div>`;
                });
                body += `</div>`;
            }
            if (statements.length) {
                body += `<table class="statement-table"><tr><th>No.</th><th>Pernyataan</th><th>Respons/Kunci</th></tr>`;
                statements.forEach((s,i) => {
                    const answer = q.statementMode === 'tf'
                        ? (s.correct ? 'Benar' : 'Salah')
                        : (s.correct ? 'Sesuai' : 'Tidak Sesuai');
                    body += `<tr><td>${i+1}</td><td>${wordEscape(wordPlain(s.text))}</td><td>${answer}</td></tr>`;
                });
                body += `</table>`;
            }
            // Kunci jawaban dan pembahasan dipindahkan ke bagian khusus di bawah seluruh soal.
            body += `</div>`;
            return body;
        };

        // ============================================================
        // UNDUH PDF: NASKAH SOAL + KUNCI + PEMBAHASAN + KISI-KISI
        // Diunduh khusus untuk setiap judul soal.
        // ============================================================
        const pdfPlain = (value) => String(value ?? '')
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<[^>]*>/g, '')
            .replace(/&nbsp;/gi, ' ')
            .replace(/&amp;/gi, '&').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
            .trim();

        const pdfSafeFileName = (value) => String(value || 'TKA_SD')
            .replace(/[\\/:*?"<>|]/g, '-')
            .replace(/\s+/g, '_')
            .slice(0, 120);

        const svgDataUrlToPng = (src, maxW = 100, maxH = 60) => new Promise((resolve) => {
            if (!src || !/^data:image\/svg\+xml/i.test(src)) return resolve(src);
            const img = new Image();
            img.onload = () => {
                try {
                    const ratio = img.width && img.height ? img.width / img.height : 1.5;
                    let w = maxW * 3, h = w / ratio;
                    if (h > maxH * 3) { h = maxH * 3; w = h * ratio; }
                    const canvas = document.createElement('canvas'); canvas.width = Math.max(1, Math.round(w)); canvas.height = Math.max(1, Math.round(h));
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/png'));
                } catch(e) { resolve(null); }
            };
            img.onerror = () => resolve(null); img.src = src;
        });

        const downloadPdfQuestions = async (questions, title = 'TKA_SD') => {
            if (!Array.isArray(questions) || !questions.length) {
                alert('Belum ada soal pada judul ini untuk diunduh.');
                return;
            }
            if (!window.jspdf || !window.jspdf.jsPDF) {
                alert('Komponen PDF belum siap. Pastikan koneksi internet aktif, lalu coba lagi.');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 15;
            const textWidth = pageWidth - margin * 2;
            let y = margin;
            let questionNo = 0;

            const safeText = (value) => pdfPlain(value).replace(/\t/g, ' ');
            const addPageIfNeeded = (needed = 8) => {
                if (y + needed > pageHeight - 15) {
                    doc.addPage();
                    y = margin;
                }
            };
            const addWrapped = (text, opts = {}) => {
                const size = opts.size || 10.5;
                const bold = !!opts.bold;
                const indent = opts.indent || 0;
                const gap = opts.gap == null ? 4 : opts.gap;
                const x = margin + indent;
                doc.setFont('helvetica', bold ? 'bold' : 'normal');
                doc.setFontSize(size);
                const lines = doc.splitTextToSize(safeText(text), textWidth - indent);
                const lineH = size * 0.43 + 1.6;
                for (const line of lines) {
                    addPageIfNeeded(lineH + 1);
                    doc.text(line, x, y);
                    y += lineH;
                }
                y += gap;
            };
            const addHeading = (text, size = 14) => {
                addPageIfNeeded(12);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(size);
                doc.text(safeText(text), margin, y);
                y += size * 0.5 + 4;
            };
            const addRule = () => {
                addPageIfNeeded(4);
                doc.setDrawColor(180);
                doc.line(margin, y, pageWidth - margin, y);
                y += 4;
            };
            const addImage = async (src, maxW = 100, maxH = 60) => {
                if (!src || typeof src !== 'string') return;
                try {
                    if (/^data:image\/svg\+xml/i.test(src)) src = await svgDataUrlToPng(src, maxW, maxH);
                    if (!src) return;
                    let format = 'PNG';
                    if (/^data:image\/jpe?g/i.test(src)) format = 'JPEG';
                    else if (/^data:image\/webp/i.test(src)) format = 'WEBP';
                    else if (/^data:image\/svg\+xml/i.test(src)) format = 'PNG';
                    const props = doc.getImageProperties(src);
                    let w = maxW;
                    let h = w * (props.height / props.width);
                    if (h > maxH) { h = maxH; w = h * (props.width / props.height); }
                    addPageIfNeeded(h + 6);
                    doc.addImage(src, format, margin, y, w, h, undefined, 'FAST');
                    y += h + 5;
                } catch (e) {
                    // Gambar yang tidak dapat dikonversi tidak menghentikan pembuatan PDF.
                }
            };

            addHeading('NASKAH SOAL TKA SMA/SMK', 16);
            addWrapped(`Judul Soal: ${title}`, { size: 12, bold: true, gap: 2 });
            const subjects = [...new Set(questions.map(getQuestionSubject))];
            addWrapped(`Mata Pelajaran: ${subjects.join(', ')}`, { size: 10.5, gap: 3 });
            addRule();

            for (const q of questions) {
                questionNo += 1;
                addHeading(`Soal ${questionNo}`, 12.5);
                addWrapped(`Mata Pelajaran: ${getQuestionSubject(q)}`, { size: 9.5, gap: 1 });
                if (q?.stimulus) {
                    addWrapped(`Stimulus${q.stimulusTitle ? ': ' + q.stimulusTitle : ''}`, { size: 9.5, bold: true, gap: 1 });
                    addWrapped(q.stimulus, { size: 10, indent: 4, gap: 2 });
                }
                if (q?.image) await addImage(q.image);
                addWrapped(q?.text || '', { size: 10.5, bold: true, gap: 3 });

                if (Array.isArray(q?.options) && q.options.length) {
                    for (let i = 0; i < q.options.length; i++) {
                        const o = q.options[i];
                        // Hilangkan awalan A-D atau 1-4 yang mungkin sudah ada agar PDF hanya memiliki satu abjad.
                        const cleanOption = pdfPlain(o).replace(/^\s*(?:[A-Da-d]|[1-4])\s*[.)-]\s*/, '');
                        addWrapped(`${String.fromCharCode(65 + i)}. ${cleanOption}`, { size: 10, indent: 4, gap: 1.5 });
                        if (q.optionImages?.[i]) await addImage(q.optionImages[i], 70, 40);
                    }
                    y += 2;
                }
                if (Array.isArray(q?.statements) && q.statements.length) {
                    for (let i = 0; i < q.statements.length; i++) {
                        const st = q.statements[i];
                        addWrapped(`${i + 1}. ${st?.text || ''}`, { size: 10, indent: 4, gap: 1 });
                    }
                    y += 2;
                }
                addRule();
            }

            // Kunci dan pembahasan
            addHeading('KUNCI JAWABAN DAN PEMBAHASAN', 14);
            questionNo = 0;
            for (const q of questions) {
                questionNo += 1;
                const key = Array.isArray(q?.correct)
                    ? q.correct.join('; ')
                    : (q?.correct || (Array.isArray(q?.statements)
                        ? q.statements.map(s => s.correct ? 'Benar' : 'Salah').join(', ')
                        : 'Belum diisi'));
                addWrapped(`Soal ${questionNo} — Kunci Jawaban: ${key}`, { size: 10, bold: true, gap: 2 });
                addWrapped(`Pembahasan: ${q?.explanation ? q.explanation : 'Pembahasan belum tersedia.'}`, { size: 10, gap: 4 });
            }

            // Kisi-kisi menggunakan tabel agar rapi dan mudah dibaca.
            addHeading('KISI-KISI SOAL', 14);
            const blueprintBody = [];
            questions.forEach((q, i) => {
                const subject = getQuestionSubject(q);
                const fields = [
                    ['Mata Pelajaran', subject],
                    ['Judul Soal', getQuestionTitle(q)],
                    ['Jenis Soal', getWordQuestionType(q)],
                    ['Bentuk Soal', getWordForm(q)],
                    ['Materi/Elemen', getWordMaterial(q)]
                ];
                if (subject === 'Matematika') {
                    fields.push(['Submateri/Sub-elemen', getWordSubmaterial(q)]);
                    fields.push(['Cakupan Sub-elemen', q?.cakupanSubelemen || q?.coverage || 'Belum diisi']);
                } else {
                    fields.push(['Subkompetensi', getWordSubcompetency(q)]);
                }
                fields.push(['Kompetensi', getWordCompetency(q)]);
                fields.push(['Level Kognitif', getWordCognitive(q)]);
                fields.push(['Proses Berpikir', getWordThinking(q)]);
                fields.forEach(([label, value], fieldIndex) => {
                    blueprintBody.push([
                        fieldIndex === 0 ? String(i + 1) : '',
                        label,
                        safeText(value || 'Belum diisi')
                    ]);
                });
            });

            if (typeof doc.autoTable === 'function') {
                doc.autoTable({
                    startY: y,
                    margin: { left: margin, right: margin, top: margin, bottom: 15 },
                    head: [['No.', 'Komponen Kisi-Kisi', 'Keterangan']],
                    body: blueprintBody,
                    theme: 'grid',
                    styles: {
                        font: 'helvetica',
                        fontSize: 8.2,
                        cellPadding: 2.2,
                        overflow: 'linebreak',
                        valign: 'top'
                    },
                    headStyles: {
                        fontStyle: 'bold',
                        halign: 'center',
                        fillColor: [219, 234, 247],
                        textColor: [0, 0, 0]
                    },
                    columnStyles: {
                        0: { cellWidth: 10, halign: 'center' },
                        1: { cellWidth: 43, fontStyle: 'bold' },
                        2: { cellWidth: 'auto' }
                    },
                    didDrawPage: () => {
                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(8);
                    }
                });
                y = (doc.lastAutoTable && doc.lastAutoTable.finalY ? doc.lastAutoTable.finalY : y) + 6;
            } else {
                // Cadangan apabila plugin AutoTable tidak tersedia.
                blueprintBody.forEach(row => {
                    addWrapped(`${row[0] ? row[0] + '. ' : ''}${row[1]}: ${row[2]}`, { size: 8.5, indent: 2, gap: 1 });
                });
            }

            doc.save(`Naskah_Soal_${pdfSafeFileName(title)}_${new Date().toISOString().slice(0,10)}.pdf`);
        };

        const downloadWordQuestions = (questions, title = 'TKA_SD') => {
            if (!Array.isArray(questions) || !questions.length) {
                alert('Belum ada soal pada Editor untuk diunduh.');
                return;
            }

            const grouped = {};
            questions.forEach(q => {
                const subject = getQuestionSubject(q);
                const examTitle = getQuestionTitle(q);
                if (!grouped[subject]) grouped[subject] = {};
                if (!grouped[subject][examTitle]) grouped[subject][examTitle] = [];
                grouped[subject][examTitle].push(q);
            });

            let questionNo = 0;
            let questionHtml = '';
            ['Bahasa Indonesia','Matematika'].forEach(subject => {
                if (!grouped[subject]) return;
                questionHtml += `<h2>${wordEscape(subject)}</h2>`;
                Object.entries(grouped[subject]).forEach(([examTitle, group]) => {
                    questionHtml += `<h3 class="exam-title">${wordEscape(examTitle)} (${group.length} soal)</h3>`;
                    group.forEach(q => {
                        questionNo += 1;
                        questionHtml += questionToWordHtml(q, questionNo);
                    });
                });
            });

            // Kunci jawaban dan pembahasan ditempatkan terpisah dari naskah soal.
            let answerHtml = '';
            let answerNo = 0;
            ['Bahasa Indonesia','Matematika'].forEach(subject => {
                if (!grouped[subject]) return;
                answerHtml += `<h2>${wordEscape(subject)}</h2>`;
                Object.entries(grouped[subject]).forEach(([examTitle, group]) => {
                    answerHtml += `<h3 class="exam-title">${wordEscape(examTitle)}</h3>`;
                    group.forEach(q => {
                        answerNo += 1;
                        const key = Array.isArray(q?.correct)
                            ? q.correct.join('; ')
                            : (q?.correct || (Array.isArray(q?.statements)
                                ? q.statements.map(s => s.correct ? 'Benar' : 'Salah').join(', ')
                                : 'Belum diisi'));
                        answerHtml += `<div class="answer-item">
                            <p><b>Soal ${answerNo} — Kunci Jawaban:</b> ${wordEscape(String(key))}</p>
                            <p><b>Pembahasan:</b> ${q?.explanation
                                ? wordEscape(wordPlain(q.explanation)).replace(/\n/g,'<br/>')
                                : 'Pembahasan belum tersedia.'}</p>
                        </div>`;
                    });
                });
            });

            let blueprintRows = '';
            questions.forEach((q,i) => {
                blueprintRows += `<tr>
                    <td>${i+1}</td>
                    <td>${wordEscape(getQuestionSubject(q))}</td>
                    <td>${wordEscape(getQuestionTitle(q))}</td>
                    <td>${wordEscape(getWordQuestionType(q))}</td>
                    <td>${wordEscape(getWordForm(q))}</td>
                    <td>${wordEscape(getWordMaterial(q))}</td>
                    <td>${wordEscape(getWordSubmaterial(q))}</td>
                    <td>${wordEscape(getWordCompetency(q))}</td>
                    <td>${wordEscape(getWordSubcompetency(q))}</td>
                    <td>${wordEscape(getWordCognitive(q))}</td>
                    <td>${wordEscape(getWordThinking(q))}</td>
                </tr>`;
            });

            const html = `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:w="urn:schemas-microsoft-com:office:word"
      xmlns="http://www.w3.org/TR/REC-html40">

</style>
</head>
<body>
<h1>NASKAH SOAL TKA SMA/MA/SMK/MAK SEDERAJAT</h1>
<div class="meta">
<p><b>Judul Paket:</b> ${wordEscape(title)}</p>
<p><b>Jumlah Soal:</b> ${questions.length}</p>
<p><b>Dokumen:</b> Naskah Soal dan Kisi-Kisi Soal</p>
</div>
${questionHtml}
<div class="page-break"></div>

<p>Kunci jawaban dan pembahasan ditempatkan terpisah dari naskah soal agar dokumen dapat digunakan sebagai naskah ujian sekaligus bahan pemeriksaan.</p>
${answerHtml}
<div class="page-break"></div>
<h1>KISI-KISI SOAL TKA SMA/MA/SMK/MAK SEDERAJAT</h1>
<p>Kisi-kisi memerinci setiap butir berdasarkan mata uji, judul soal, jenis soal, bentuk soal, materi/elemen, submateri/sub-elemen, kompetensi, subkompetensi, level kognitif, dan proses berpikir.</p>
<table class="blueprint">
<thead><tr>

</tr></thead>

            const blob = new Blob(['\ufeff', html], {type:'application/msword'});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            const safeTitle = String(title || 'TKA_SD').replace(/[/\\?%*:|"<>]/g,'-');
            link.download = `${safeTitle}_Soal_dan_KisiKisi.doc`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };

        const ConfirmationModal = ({ isOpen, title, message, onConfirm, onCancel, confirmText = "Ya, Lanjutkan", cancelText = "Batal", isDanger = false }) => {
            if (!isOpen) return null;
            return (

            const [showKey,setShowKey]=useState(false);

            const [status,setStatus]=useState('');

            const typeLabels={single:'PG Sederhana',complex:'PGK MCMA',statement:'PGK Kategori'};

            const setTypeCount=(key,value)=>setQuestionCounts(prev=>({...prev,[key]:Math.max(0,Math.min(20,Number(value)||0))}));
            const generate = async () => {

                try {
                    let raw=[];

                            if(subject==='Matematika') raw.push({...buildMathItem(level,qtype,element,difficulty,topic), cakupanSubelemen:coverageSelection||'Semua cakupan pada sub-elemen', coverage:coverageSelection||'Semua cakupan pada sub-elemen'});
                            else if(subject==='Bahasa Inggris'){ const q=buildEnglishItems(level,qtype,itemType==='Grup',shared,gid,difficulty,topic); raw.push({...q,subject:'Bahasa Inggris',element,subelement:subSelection,competency,subcompetency:subSelection,cognitiveLevel:level,thinkingProcess}); } else raw.push(buildBIItems(level,qtype,itemType==='Grup',shared,gid,difficulty,topic));
                        });
                    } else {
                        if(!apiKey.trim()) throw new Error('Masukkan API key AI terlebih dahulu. Key hanya disimpan selama sesi browser ini.');
                        setTkaAiKey(apiKey.trim());
                        const prompt = `Anda adalah pengembang asesmen TKA SMA/SMK Indonesia yang sangat berpengalaman. Buat tepat ${totalCount} soal berkualitas tinggi berdasarkan blueprint berikut: ${JSON.stringify(payload)}. DISTRIBUSI BENTUK SOAL WAJIB: PG Sederhana=${questionCounts.single}, PGK MCMA=${questionCounts.complex}, PGK Kategori=${questionCounts.statement}. Jangan mengubah jumlah tiap bentuk. Gunakan kerangka TKA SMA/SMK yang berlaku: Bahasa Indonesia berfokus pada keterampilan membaca melalui teks informasi/fiksi; kompetensinya pemahaman tekstual, pemahaman inferensial, serta evaluasi dan apresiasi. Matematika mencakup Bilangan, Aljabar, Geometri dan Pengukuran, Trigonometri, serta Data dan Peluang dengan kompetensi pengetahuan matematika, representasi matematis, penalaran dan pembuktian matematis, pemecahan masalah matematis, dan koneksi matematis. Bahasa Inggris mencakup keterampilan membaca dengan kompetensi pemahaman tekstual, pemahaman inferensial, serta evaluasi dan apresiasi; jenis teks descriptive, recount, narrative, procedure, dan analytical exposition; konteks sehari-hari, vokasional, dan akademik; serta kompleksitas A2 dan B1. Soal harus menekankan penerapan, penalaran, dan pemecahan masalah, bukan latihan hitung rutin.

ATURAN MUTU WAJIB: 1) Setiap soal harus memiliki tujuan ukur yang jelas dan benar-benar sesuai level kognitif yang diminta. 2) Hindari soal hafalan langsung, angka terlalu sederhana, kalimat generik, dan pola soal yang sama berulang. 3) Untuk Matematika, utamakan stimulus/konteks yang realistis dan minimal 2 langkah berpikir untuk Aplikasi/Penalaran; data harus cukup untuk menyelesaikan masalah dan semua opsi harus masuk akal sebagai pengecoh yang berasal dari kesalahan umum, bukan opsi asal. 4) Untuk Penalaran, minta siswa membandingkan, menghubungkan informasi, memilih strategi, menafsirkan hasil, atau mengevaluasi pernyataan. 5) Untuk Bahasa Indonesia, gunakan stimulus 150–200 kata untuk soal grup/tunggal yang berbasis bacaan; pertanyaan harus dapat dijawab dari teks tetapi tidak sekadar menyalin kalimat. Variasikan pertanyaan tentang informasi tersurat, inferensi, ide pokok/gagasan pendukung, kosakata dalam konteks, hubungan sebab-akibat, kesesuaian informasi, dan evaluasi/relevansi. 6) Jika itemType=Grup, buat satu stimulus yang cukup kaya untuk 3 soal yang berbeda dan saling terkait, bukan tiga pertanyaan yang identik. 7) Hindari petunjuk jawaban dari panjang opsi, kata yang berulang secara mencolok, atau pilihan yang jelas salah. 8) Pastikan hanya ada satu jawaban benar untuk single; MCMA memiliki sedikitnya dua jawaban benar; kategori memiliki kombinasi benar/salah yang dapat dibuktikan. 9) explanation harus menjelaskan langkah penalaran, bukan hanya menyebut kunci. 10) Jika soal membutuhkan diagram, tabel, bangun, denah, posisi, pecahan bergambar, atau visualisasi ruang, imageRequired=true dan WAJIB membuat SVG mandiri pada imageSvg. Gambar harus benar-benar diperlukan untuk menyelesaikan soal, memiliki label/angka yang konsisten dengan stimulus, dan tidak dekoratif. 11) Jangan menggunakan URL gambar eksternal. 12) Jangan mengklaim soal sebagai soal resmi pemerintah. 13) KHUSUS MATEMATIKA: jika cakupanSubelemen bukan "Semua cakupan pada sub-elemen", setiap butir wajib mengukur cakupan yang dipilih secara substantif. Jangan hanya menyalin label cakupan. Jika semua cakupan dipilih, distribusikan butir pada cakupan yang tersedia secara wajar.

SKEMA JSON WAJIB: setiap objek memiliki id,type,text,stimulus,options,correct,statements,explanation,subject,element,subelement,competency,subcompetency,cakupanSubelemen,coverage,cognitiveLevel,thinkingProcess,itemType,imageSvg,imageAlt,imageRequired,imageDescription,optionImageSvgs. Untuk single tepat 5 opsi A-E dan correct berupa teks opsi. Untuk complex tepat 5 opsi A-E dan correct berupa array teks opsi benar. Untuk statement statements berisi sedikitnya 3 objek text dan correct boolean serta statementMode yang sesuai. Kembalikan hanya JSON valid tanpa markdown. Sebelum mengembalikan, lakukan pemeriksaan internal: hitung ulang semua angka, cek kunci terhadap opsi/pernyataan, cek konsistensi stimulus-gambar, cek level kognitif, cek tidak ada opsi duplikat, dan cek bahwa soal tidak dangkal.`;
                        // Fallback model otomatis khusus GENERATOR SOAL TKA (bukan TRYOUT).
                         // Urutan: model utama -> model Flash -> Flash-Lite.
                         const aiModels = [

                         const aiBody={contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}};
                         let response=null, data=null, lastAiError=null, usedModel='', parsed=null;

                         for(let modelIndex=0; modelIndex<aiModels.length && !raw.length; modelIndex++){

                             const aiUrl=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey.trim())}`;

                             for(let attempt=1; attempt<=2 && !raw.length; attempt++){
                                 try{
                                     if(modelIndex>0){
                                         setStatus(`Model ${aiModels[modelIndex-1]} sedang padat/gagal. Beralih otomatis ke ${model} (${modelIndex+1}/${aiModels.length})...`);
                                     } else if(attempt>1){
                                         setStatus(`Model ${model} sedang padat. Mencoba kembali (${attempt}/2)...`);

                                     if(attempt>1) {

                                         headers:{'Content-Type':'application/json'},

                                     if(!response.ok){

                                         lastAiError=new Error(msg);

                                         continue;

                                     const candidateText=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
                                     if(!candidateText.trim()){

                                     if(!isRetryableAiFailure(fetchError?.status,fetchError?.message)) throw fetchError;
                                 }
                             }
                         }

                         if(!raw.length) {

                         }

                         if(usedModel && usedModel!==aiModels[0]){

                    }

                                else fallback.push(buildBIItems(level,qtype,itemType==='Grup',shared,gid,difficulty,topic));
                            });
                            const normalizedFallback=fallback.map((q,i)=>normalizeAIQuestion({...q, subelement:subject==='Matematika'?subSelection:'', subcompetency:subject==='Bahasa Indonesia'?subSelection:'', cakupanSubelemen:subject==='Matematika'?(coverageSelection||'Semua cakupan pada sub-elemen'):'', coverage:subject==='Matematika'?(coverageSelection||'Semua cakupan pada sub-elemen'):''},i));
                            const checkedFallback=normalizedFallback.map((q,i)=>({q:repairQuestionForValidation(q),issues:validateAIQuestion(q),index:i}));

            const accept = () => {

                onGenerate(good);

            return <div className="fixed inset-0 z-[70] bg-black bg-opacity-50 flex items-center justify-center p-4 fade-in"><div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[92vh] overflow-y-auto"><div className="p-6 border-b flex justify-between items-center sticky top-0 bg-white z-10"><div><h3 className="text-xl font-extrabold text-gray-800">🤖 Generator Soal TKA SMA/SMK</h3><p className="text-xs text-gray-500 mt-1">AI Gemini dengan API key milik sekolah. Jika model utama sedang padat/gagal, sistem otomatis beralih ke model Gemini Flash cadangan. Gambar yang diperlukan dibuat otomatis oleh AI, lalu diperiksa oleh validator lokal dan generator cadangan.</p></div><button onClick={onCancel}><X size={24}/></button></div><div className="p-6 space-y-5"><div className="grid md:grid-cols-3 gap-4"><div><label className="block text-sm font-bold mb-1">Mata Uji</label><select value={subject} onChange={e=>{const nextSubject=e.target.value;const nextElement=nextSubject==='Matematika'?'Bilangan':nextSubject==='Bahasa Inggris'?'Jenis Teks':'Keterampilan Membaca';const nextCompetency=nextSubject==='Matematika'?'Pemecahan masalah matematis':nextSubject==='Bahasa Inggris'?'Pemahaman Tekstual':'Pemahaman Tekstual';setSubject(nextSubject);setElement(nextElement);setCompetency(nextCompetency);const nextSub=nextSubject==='Matematika'?(TKA_META.mathSubelements[nextElement]||[])[0]||'':nextSubject==='Bahasa Inggris'?(TKA_META.englishSubcompetencies[nextCompetency]||[])[0]||'':(TKA_META.biSubcompetencies[nextCompetency]||[])[0]||'';setSubSelection(nextSub);setCoverageSelection(nextSubject==='Matematika'?(TKA_META.mathCoverage[nextSub]||[])[0]||'':'')}} className="w-full p-3 border rounded-lg">{TKA_META.subjects.map(x=><option key={x}>{x}</option>)}</select></div><div><label className="block text-sm font-bold mb-1">Elemen</label>{subject==='Matematika'?<select value={element} onChange={e=>{const nextElement=e.target.value;setElement(nextElement);const nextSub=(TKA_META.mathSubelements[nextElement]||[])[0]||'';setSubSelection(nextSub);setCoverageSelection((TKA_META.mathCoverage[nextSub]||[])[0]||'')}} className="w-full p-3 border rounded-lg">{TKA_META.mathElements.map(x=><option key={x}>{x}</option>)}</select>:subject==='Bahasa Inggris'?<select value={element} onChange={e=>{const nextElement=e.target.value;setElement(nextElement);setSubSelection((TKA_META.englishSubmaterials[nextElement]||[])[0]||'')}} className="w-full p-3 border rounded-lg">{TKA_META.englishMaterials.map(x=><option key={x}>{x}</option>)}</select>:<input readOnly value="Keterampilan Membaca" className="w-full p-3 border rounded-lg bg-gray-50"/>}</div><div><label className="block text-sm font-bold mb-1">Level Kognitif</label><select value={level} onChange={e=>{setLevel(e.target.value);setThinkingProcess(TKA_META.cognitive[e.target.value][0])}} className="w-full p-3 border rounded-lg">{Object.keys(TKA_META.cognitive).map(x=><option key={x}>{x}</option>)}</select></div><div><label className="block text-sm font-bold mb-1">Kompetensi</label><select value={competency} onChange={e=>{setCompetency(e.target.value);const next=subject==='Bahasa Indonesia'?(TKA_META.biSubcompetencies[e.target.value]||[]):subject==='Bahasa Inggris'?(TKA_META.englishSubcompetencies[e.target.value]||[]):(TKA_META.mathSubelements[element]||[]);const nextSub=next[0]||'';setSubSelection(nextSub);setCoverageSelection(subject==='Matematika'?(TKA_META.mathCoverage[nextSub]||[])[0]||'':'')}} className="w-full p-3 border rounded-lg">{(subject==='Matematika'?TKA_META.mathCompetencies:subject==='Bahasa Inggris'?TKA_META.englishCompetencies:TKA_META.biCompetencies).map(x=><option key={x}>{x}</option>)}</select></div><div className="md:col-span-3"><label className="block text-sm font-bold mb-1">{subject==='Matematika'?'Sub-elemen / Submateri':'Subkompetensi'}</label><select value={subSelection} onChange={e=>{const nextSub=e.target.value;setSubSelection(nextSub);setCoverageSelection(subject==='Matematika'?(TKA_META.mathCoverage[nextSub]||[])[0]||'':'')}} className="w-full p-3 border rounded-lg">{availableSubSelections.map(x=><option key={x}>{x}</option>)}{availableSubSelections.length===0&&<option value="">Tidak tersedia</option>}</select><p className="text-xs text-gray-500 mt-1">Pilihan mengikuti kompetensi/elemen yang dipilih dan kerangka TKA SMA/SMK.</p></div>{subject==='Matematika'&&<div className="md:col-span-3"><label className="block text-sm font-bold mb-1">Pilihan Cakupan Sub-elemen</label><select value={coverageSelection} onChange={e=>setCoverageSelection(e.target.value)} className="w-full p-3 border rounded-lg"><option value="">Semua cakupan pada sub-elemen</option>{availableCoverages.map(x=><option key={x} value={x}>{x}</option>)}</select><p className="text-xs text-gray-500 mt-1">Pilih cakupan sesuai tabel kerangka TKA SMA/SMK. Cakupan ini menjadi dasar pembuatan dan analisis butir Matematika.</p></div>}<div className="md:col-span-3 border rounded-xl p-4 bg-gray-50"><label className="block text-sm font-bold mb-2">Bentuk Soal dan Jumlah Soal</label><p className="text-xs text-gray-500 mb-3">Pilih jumlah masing-masing bentuk soal. Semua bentuk dapat dibuat sekaligus pada kompetensi yang dipilih. Generator Tryout mendukung hingga 100 soal per paket.</p><div className="grid md:grid-cols-3 gap-3"><div className="bg-white border rounded-lg p-3"><div className="font-bold text-sm">PG Sederhana</div><div className="text-xs text-gray-500 mb-2">1 jawaban benar • 5 opsi A-E</div><input type="number" min="0" max="20" value={questionCounts.single} onChange={e=>setTypeCount('single',e.target.value)} className="w-full p-2 border rounded-lg"/></div><div className="bg-white border rounded-lg p-3"><div className="font-bold text-sm">PGK MCMA</div><div className="text-xs text-gray-500 mb-2">lebih dari satu jawaban benar • 5 opsi A-E</div><input type="number" min="0" max="20" value={questionCounts.complex} onChange={e=>setTypeCount('complex',e.target.value)} className="w-full p-2 border rounded-lg"/></div><div className="bg-white border rounded-lg p-3"><div className="font-bold text-sm">PGK Kategori</div><div className="text-xs text-gray-500 mb-2">respons kategori kontekstual</div><input type="number" min="0" max="20" value={questionCounts.statement} onChange={e=>setTypeCount('statement',e.target.value)} className="w-full p-2 border rounded-lg"/></div></div><div className="mt-3 text-sm font-bold text-indigo-700">Total soal: {totalCount} / 20</div></div><div><label className="block text-sm font-bold mb-1">Kesulitan</label><select value={difficulty} onChange={e=>setDifficulty(e.target.value)} className="w-full p-3 border rounded-lg"><option>Mudah</option><option>Sedang</option><option>Sulit</option></select></div><div><label className="block text-sm font-bold mb-1">Jenis</label><select value={itemType} onChange={e=>setItemType(e.target.value)} className="w-full p-3 border rounded-lg"><option>Tunggal</option><option>Grup</option></select></div><div><label className="block text-sm font-bold mb-1">Sumber Generator</label><select value={mode} onChange={e=>setMode(e.target.value)} className="w-full p-3 border rounded-lg"><option value="ai">AI Gemini (API Key Sekolah)</option><option value="local">Lokal / Cadangan</option></select></div><div><label className="block text-sm font-bold mb-1">API Key AI</label><input type={showKey?'text':'password'} value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="API key Gemini sekolah" className="w-full p-3 border rounded-lg"/><label className="text-xs text-gray-500 flex items-center gap-2 mt-1"><input type="checkbox" checked={showKey} onChange={e=>setShowKey(e.target.checked)}/> Tampilkan key</label><p className="text-xs text-orange-700 mt-1">Jangan bagikan file HTML yang berisi key. Key hanya disimpan selama sesi browser.</p></div></div><div><label className="block text-sm font-bold mb-1">Topik atau konteks tambahan (opsional)</label><input value={topic} onChange={e=>setTopic(e.target.value)} placeholder="Contoh: lingkungan sekolah, pecahan, diagram batang" className="w-full p-3 border rounded-lg"/></div>{status&&<div className="p-3 rounded-lg bg-blue-50 border border-blue-200 text-sm text-blue-900">{status}</div>}{preview.length>0&&<div className="space-y-3"><div className="flex justify-between items-center"><h4 className="font-bold">Hasil AI</h4><button onClick={generate} disabled={busy} className="px-3 py-2 rounded-lg bg-amber-500 text-white font-bold">Regenerasi</button></div>{preview.map(({q,issues},i)=><div key={q.id} className="border rounded-xl p-4"><div className="flex justify-between gap-3"><b>Soal {i+1}</b>{issues.length?<span className="text-xs bg-orange-100 text-orange-800 px-2 py-1 rounded">{issues.length} masalah</span>:<span className="text-xs bg-green-100 text-green-800 px-2 py-1 rounded">Lolos validasi dasar</span>}</div><p className="mt-2 text-sm whitespace-pre-wrap">{q.text}</p>{q.image&&<div className="mt-3 rounded-lg border bg-gray-50 p-2"><div className="text-xs font-semibold text-gray-500 mb-2">Gambar dibuat otomatis oleh AI</div><img src={q.image} alt={q.imageAlt||"Gambar pendukung soal"} className="max-w-full max-h-64 mx-auto object-contain" /></div>}{q.imageRequired&&!q.image&&<div className="mt-3 text-xs text-orange-700 bg-orange-50 border border-orange-200 rounded-lg p-2">AI menandai soal ini membutuhkan gambar, tetapi gambar belum berhasil dibuat. Silakan regenerasi.</div>}{q.options.length>0&&<ol className="list-decimal ml-6 mt-2 text-sm">{q.options.map((o,j)=><li key={j}>{q.optionImages&&q.optionImages[j]&&<img src={q.optionImages[j]} alt={`Gambar opsi ${j+1}`} className="max-h-20 max-w-full object-contain mb-1"/>}{o}</li>)}</ol>}<details className="mt-3 text-sm"><summary className="cursor-pointer font-semibold">Kunci, pembahasan, dan catatan validasi</summary><p className="mt-2"><b>Kunci:</b> {Array.isArray(q.correct)?q.correct.join('; '):q.correct}</p><p className="mt-2"><b>Pembahasan:</b> {q.explanation}</p>{issues.length>0&&<ul className="list-disc ml-5 mt-2 text-orange-700">{issues.map((x,j)=><li key={j}>{x}</li>)}</ul>}</details></div>)}</div>}</div><div className="p-5 border-t bg-gray-50 flex justify-end gap-3 sticky bottom-0"><button onClick={onCancel} className="px-5 py-2 rounded-lg font-bold text-gray-600">Batal</button><button disabled={busy} onClick={generate} className="px-6 py-2 rounded-lg bg-indigo-600 text-white font-bold">{busy?'Memproses...':'Buat Soal'}</button><button disabled={!preview.length||busy} onClick={accept} className="px-6 py-2 rounded-lg bg-green-600 text-white font-bold">Tambahkan ke Editor</button></div></div></div>;
        };


        // ============================================================
        // GENERATOR TRYOUT TKA - mode menyeluruh seluruh komponen mapel
        // ============================================================
        const buildTryoutBlueprint = (subject, totalCount, difficulty='Sedang', counts={single:12,complex:4,statement:4}) => {
            const types=[];
            Object.entries(counts).forEach(([t,n])=>{ for(let i=0;i<n;i++) types.push(t); });
            while(types.length<totalCount) types.push('single');
            types.length=totalCount;
            const cognitiveCycle=['Aplikasi','Aplikasi','Penalaran','Pengetahuan dan Pemahaman','Penalaran'];
            const thinking=(level,i)=>{const arr=TKA_META.cognitive[level]||[];return arr[i%Math.max(1,arr.length)]||'';};
            const blueprint=[];
            if(subject==='Matematika'){
                const slots=[];
                TKA_META.mathElements.forEach(element=>{
                    (TKA_META.mathSubelements[element]||[]).forEach(subelement=>{
                        const covers=TKA_META.mathCoverage[subelement]||[];
                        slots.push({element,subelement,coverage:covers[0]||'Semua cakupan pada sub-elemen'});
                    });
                });
                for(let i=0;i<totalCount;i++){
                    const x=slots[i%slots.length];
                    const cognitiveLevel=cognitiveCycle[i%cognitiveCycle.length];
                    blueprint.push({...x,subject:'Matematika',competency:TKA_META.mathCompetencies[i%TKA_META.mathCompetencies.length],cognitiveLevel,thinkingProcess:thinking(cognitiveLevel,i),type:types[i],difficulty});
                }
            } else if(subject==='Bahasa Inggris'){
                const slots=[];
                TKA_META.englishMaterials.forEach(element=>{
                    (TKA_META.englishSubmaterials[element]||[]).forEach(subelement=>slots.push({element,subelement}));
                });
                for(let i=0;i<totalCount;i++){
                    const x=slots[i%slots.length];
                    const cognitiveLevel=cognitiveCycle[i%cognitiveCycle.length];
                    const comp=TKA_META.englishCompetencies[i%TKA_META.englishCompetencies.length];
                    const subs=TKA_META.englishSubcompetencies[comp]||[];
                    blueprint.push({...x,subject:'Bahasa Inggris',competency:comp,subcompetency:subs[i%Math.max(1,subs.length)]||'',cognitiveLevel,thinkingProcess:thinking(cognitiveLevel,i),type:types[i],difficulty});
                }
            } else {
                const comps=TKA_META.biCompetencies;
                const slots=[];
                comps.forEach(comp=>{(TKA_META.biSubcompetencies[comp]||[]).forEach(subcompetency=>slots.push({element:'Keterampilan Membaca',subelement:'',competency:comp,subcompetency}));});
                for(let i=0;i<totalCount;i++){
                    const x=slots[i%slots.length];
                    const cognitiveLevel=cognitiveCycle[i%cognitiveCycle.length];
                    blueprint.push({...x,subject:'Bahasa Indonesia',cognitiveLevel,thinkingProcess:thinking(cognitiveLevel,i),type:types[i],difficulty});
                }
            }
            return blueprint.slice(0,totalCount);
        };

        const friendlyAiError = (e, context='AI') => {
            const msg = String(e?.message || e || '');
            const lower = msg.toLowerCase();
            const waitMatch = msg.match(/(?:retry in|try again in)\s*([0-9]+(?:\.[0-9]+)?)s/i);
            const waitSec = waitMatch ? Math.ceil(Number(waitMatch[1])) : null;
            if (lower.includes('quota exceeded') || lower.includes('free_tier_requests') || lower.includes('rate limit') || lower.includes('too many requests') || /\b429\b/.test(lower)) {
                return waitSec
                    ? `⚠️ ${context} belum dapat diproses karena batas permintaan Gemini sedang tercapai. Silakan tunggu sekitar ${waitSec} detik, lalu klik **Regenerasi Validasi** kembali. Soal yang sudah valid tetap dipertahankan.`
                    : `⚠️ ${context} belum dapat diproses karena batas permintaan Gemini sedang tercapai. Silakan tunggu beberapa saat, lalu klik **Regenerasi Validasi** kembali. Soal yang sudah valid tetap dipertahankan.`;
            }
            if (lower.includes('high demand') || lower.includes('spikes in demand') || lower.includes('currently experiencing high demand')) {
                return `⚠️ Semua model Gemini yang tersedia untuk generator sedang sibuk atau tidak merespons. Silakan coba **Regenerasi** beberapa saat lagi. Soal yang sudah valid tetap dipertahankan.`;
            }
            if (lower.includes('503') || lower.includes('service unavailable') || lower.includes('temporarily unavailable')) {
                return `⚠️ Layanan Gemini sementara tidak tersedia. Silakan tunggu beberapa saat kemudian dan klik **Regenerasi Validasi** kembali. Soal yang sudah valid tetap dipertahankan.`;
            }
            if (lower.includes('502') || lower.includes('500')) {
                return `⚠️ Layanan Gemini mengalami gangguan sementara. Silakan klik **Regenerasi Validasi** kembali. Soal yang sudah valid tetap dipertahankan.`;
            }
            return `⚠️ ${context} belum berhasil. ${msg || 'Terjadi gangguan sementara pada layanan AI.'} Silakan coba lagi.`;
        };

        const TryoutGenerator = ({ onGenerate, onCancel }) => {
            const [subject,setSubject]=useState('Matematika');
            const [totalCount,setTotalCount]=useState(20);
            const [questionCounts,setQuestionCounts]=useState({single:12,complex:4,statement:4});
            const [difficulty,setDifficulty]=useState('Sedang');
            const [mode,setMode]=useState('ai');
            const [apiKey,setApiKey]=useState(getTkaAiKey());
            const [showKey,setShowKey]=useState(false);
            const [topic,setTopic]=useState('');
            const [busy,setBusy]=useState(false);
            const [status,setStatus]=useState('');
            const [preview,setPreview]=useState([]);
            const blueprint=buildTryoutBlueprint(subject,totalCount,difficulty,questionCounts);
            const typeLabel={single:'PG Sederhana',complex:'PGK MCMA',statement:'PGK Kategori'};
            const totalTypes=Object.values(questionCounts).reduce((a,b)=>a+b,0);
            const TRYOUT_MAX_QUESTIONS = 100;
            const setCount=(k,v)=>setQuestionCounts(prev=>({...prev,[k]:Math.max(0,Math.min(TRYOUT_MAX_QUESTIONS,Number(v)||0))}));
            const generate=async()=>{
                if(totalCount<5||totalCount>TRYOUT_MAX_QUESTIONS){alert(`Jumlah tryout harus 5–${TRYOUT_MAX_QUESTIONS} soal.`);return;}
                if(totalTypes!==totalCount){alert(`Jumlah bentuk soal (${totalTypes}) harus sama dengan total tryout (${totalCount}).`);return;}
                setBusy(true);setStatus('Menyusun blueprint tryout menyeluruh...');
                const payload={mode:'TRYOUT TKA SMA/SMK',subject,totalCount,difficulty,topic,questionDistribution:questionCounts,blueprint};
                try{
                    let raw=[];
                    if(mode==='local'){
                        blueprint.forEach((b,i)=>{
                            if(subject==='Matematika') raw.push({...buildMathItem(b.cognitiveLevel,b.type,b.element,difficulty,topic),subject:'Matematika',element:b.element,subelement:b.subelement,competency:b.competency,cognitiveLevel:b.cognitiveLevel,thinkingProcess:b.thinkingProcess,cakupanSubelemen:b.coverage,coverage:b.coverage});
                            else { const q=buildBIItems(b.cognitiveLevel,b.type,false,null,null,difficulty,topic); raw.push({...q,subject:subject,element:b.element,subelement:b.subelement,competency:b.competency,subcompetency:b.subcompetency||'',cognitiveLevel:b.cognitiveLevel,thinkingProcess:b.thinkingProcess}); }
                        });
                    } else {
                        if(!apiKey.trim()) throw new Error('Masukkan API key AI terlebih dahulu.');
                        setTkaAiKey(apiKey.trim());
                        const prompt=`Anda adalah pengembang asesmen TKA SMA/SMK Indonesia. Ikuti kerangka asesmen Perka BSKAP Nomor 045/H/AN/2025. Buat tepat ${totalCount} soal sebagai PAKET TRYOUT MENYELURUH untuk mata uji ${subject}. Blueprint per butir berikut adalah WAJIB diikuti: ${JSON.stringify(payload)}. Jangan mengubah jumlah atau urutan blueprint. Tryout harus mencakup seluruh elemen/sub-elemen kompetensi yang tercantum dan mendistribusikan cakupan secara seimbang sesuai blueprint. Setiap butir wajib memiliki metadata sesuai baris blueprint-nya. Untuk Matematika, cakupanSubelemen/coverage wajib diukur secara substantif; jangan hanya menyalin label. Untuk Bahasa Indonesia, gunakan bacaan yang relevan dengan kompetensi/subkompetensi. Untuk Bahasa Inggris, gunakan teks bahasa Inggris sesuai jenis teks, konteks komunikasi, dan kompleksitas A2/B1 pada blueprint dan hindari pertanyaan yang jawabannya sekadar menyalin satu kalimat. Variasikan konteks, angka, strategi, bentuk penalaran, dan pengecoh. PG sederhana tepat satu kunci dan TEPAT 5 opsi A-E, setiap opsi wajib berupa teks jawaban lengkap dan tidak boleh hanya berisi label A, B, C, D, atau E; PGK MCMA memiliki minimal dua kunci dan TEPAT 5 opsi A-E, setiap opsi wajib berupa teks jawaban lengkap dan tidak boleh hanya berisi label A-E; PGK kategori menggunakan minimal 3 pernyataan dan pasangan respons kontekstual yang disimpan pada statementMode, misalnya tf=Benar/Salah, sa=Sesuai/Tidak Sesuai, tp=Tepat/Tidak Tepat, td=Tepat Dilakukan/Tidak Tepat Dilakukan, cr=Conservation/Relaxation, ef=Efektif/Tidak Efektif, atau ya/ps sesuai konteks. Jangan memakai Benar/Salah secara default jika konteks menuntut pasangan kategori lain. Untuk soal grup, gunakan stimulus bersama yang kaya dan soal saling terkait. Jika visual benar-benar diperlukan, buat SVG mandiri pada imageSvg. Jangan gunakan URL gambar eksternal. Kembalikan HANYA JSON valid berupa array objek. Skema setiap objek: id,type,text,stimulus,options,correct,statements,explanation,subject,element,subelement,competency,subcompetency,cakupanSubelemen,coverage,cognitiveLevel,thinkingProcess,itemType,imageSvg,imageAlt,imageRequired,imageDescription,optionImageSvgs. Lakukan pemeriksaan internal atas kunci, angka, konsistensi stimulus, level kognitif, duplikasi opsi, dan kesesuaian blueprint.`;
                        // Fallback model otomatis untuk GENERATOR TRYOUT TKA.
                        // Urutan: model utama -> Flash -> Flash-Lite.
                        const aiModels = [
                            'gemini-3.6-flash',
                            'gemini-3.5-flash',
                            'gemini-3.5-flash-lite',
                            'gemini-3.1-flash-lite'
                        ];
                        const aiBody={contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}};
                        let response=null,data=null,lastAiError=null,usedModel='',parsed=null;
                        const isRetryableAiFailure=(status,msg='')=>{
                            const s=String(status||'').toLowerCase();
                            const m=String(msg||'').toLowerCase();
                            return [408,425,429,500,502,503,504].includes(Number(status)) ||
                                /high demand|spikes in demand|currently experiencing high demand|quota exceeded|rate limit|too many requests|temporarily unavailable|service unavailable/.test(m) ||
                                /\b408\b|\b429\b|\b500\b|\b502\b|\b503\b|\b504\b/.test(s);
                        };

                        for(let modelIndex=0;modelIndex<aiModels.length && !raw.length;modelIndex++){
                            const model=aiModels[modelIndex];
                            const aiUrl=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey.trim())}`;
                            for(let attempt=1;attempt<=2 && !raw.length;attempt++){
                                try{
                                    if(modelIndex>0){
                                        setStatus(`Model ${aiModels[modelIndex-1]} sedang padat/gagal. Beralih otomatis ke ${model} (${modelIndex+1}/${aiModels.length})...`);
                                    }else if(attempt>1){
                                        setStatus(`Model ${model} sedang padat. Mencoba kembali (${attempt}/2)...`);
                                    }
                                    if(attempt>1) await new Promise(r=>setTimeout(r,1800*Math.pow(2,attempt-2)));
                                    response=await fetch(aiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(aiBody)});
                                    data=await response.json().catch(()=>({}));
                                    if(!response.ok){
                                        const msg=data.error?.message||`Layanan AI gagal (HTTP ${response.status}).`;
                                        lastAiError=new Error(msg);
                                        if(!isRetryableAiFailure(response.status,msg)) throw lastAiError;
                                        continue;
                                    }
                                    const txt=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';
                                    if(!txt.trim()){lastAiError=new Error(`Model ${model} tidak mengembalikan soal.`);continue;}
                                    const cleaned=txt.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
                                    try{parsed=JSON.parse(cleaned);}catch(e){lastAiError=new Error(`Model ${model} mengembalikan JSON tidak valid.`);continue;}
                                    const candidateRaw=Array.isArray(parsed)?parsed:(Array.isArray(parsed.questions)?parsed.questions:[]);
                                    if(!candidateRaw.length){lastAiError=new Error(`Model ${model} tidak menghasilkan daftar soal.`);continue;}
                                    raw=candidateRaw;usedModel=model;
                                }catch(e){
                                    lastAiError=e;
                                    if(!isRetryableAiFailure(e?.status,e?.message)) throw e;
                                }
                            }
                        }
                        if(!raw.length) throw(lastAiError||new Error('Semua model AI TRYOUT gagal merespons.'));
                        if(usedModel && usedModel!==aiModels[0]) setStatus(`TRYOUT berhasil dibuat menggunakan fallback ${usedModel}.`);
                    }
                    const normalized=raw.slice(0,totalCount).map((q,i)=>normalizeAIQuestion({...q,...blueprint[i],subelement:blueprint[i].subelement||q.subelement||'',subcompetency:blueprint[i].subcompetency||q.subcompetency||'',cakupanSubelemen:blueprint[i].coverage||q.cakupanSubelemen||q.coverage||'',coverage:blueprint[i].coverage||q.coverage||q.cakupanSubelemen||''},i));
                    const checked=normalized.map((q,i)=>({q:repairQuestionForValidation(q),issues:validateAIQuestion(q),index:i,blueprint:blueprint[i]}));
                    setPreview(checked);setStatus(`Blueprint selesai: ${checked.length} soal siap ditinjau. ${checked.filter(x=>x.issues.length).length} butir perlu ditinjau.`);
                }catch(e){setPreview([]);setStatus(friendlyAiError(e,'Pembuatan tryout'));}
                finally{setBusy(false);}
            };
            const validatePreview=()=>{ if(!preview.length) return alert('Belum ada soal tryout untuk divalidasi.'); const rechecked=preview.map((item,i)=>({ ...item, q:repairQuestionForValidation(item.q), issues:validateAIQuestion(repairQuestionForValidation(item.q)), index:i, blueprint:blueprint[i] })); setPreview(rechecked); const bad=rechecked.filter(x=>x.issues.length).length; setStatus(bad?`Validasi selesai: ${bad} butir masih bermasalah dan perlu diregenerasi.`:'Validasi selesai: semua butir lolos validasi dasar.'); };
            const regenerateInvalid=async()=>{
                if(!preview.length) return alert('Buat tryout terlebih dahulu.');
                const invalid=preview.filter(x=>x.issues.length);
                if(!invalid.length){validatePreview();return alert('Tidak ada soal bermasalah. Semua soal sudah lolos validasi dasar.');}
                if(mode==='ai'&&!apiKey.trim()) return alert('Masukkan API key AI terlebih dahulu untuk meregenerasi soal yang bermasalah.');
                setBusy(true); setStatus(`Meregenerasi ${invalid.length} soal yang belum lolos validasi...`);
                try{
                    if(mode==='local'){
                        const next=[...preview];
                        invalid.forEach(item=>{const b=blueprint[item.index];let q;if(subject==='Matematika'){q={...buildMathItem(b.cognitiveLevel,b.type,b.element,difficulty,topic),subject:'Matematika',element:b.element,subelement:b.subelement,competency:b.competency,cognitiveLevel:b.cognitiveLevel,thinkingProcess:b.thinkingProcess,cakupanSubelemen:b.coverage,coverage:b.coverage};}else if(subject==='Bahasa Inggris'){const base=buildEnglishItems(b.cognitiveLevel,b.type,false,null,null,difficulty,topic);q={...base,subject:'Bahasa Inggris',element:b.element,subelement:b.subelement,competency:b.competency,subcompetency:b.subcompetency,cognitiveLevel:b.cognitiveLevel,thinkingProcess:b.thinkingProcess};}else{const base=buildBIItems(b.cognitiveLevel,b.type,false,null,null,difficulty,topic);q={...base,subject:'Bahasa Indonesia',element:'Keterampilan Membaca',subelement:'',competency:b.competency,subcompetency:b.subcompetency,cognitiveLevel:b.cognitiveLevel,thinkingProcess:b.thinkingProcess};}const fixed=repairQuestionForValidation(normalizeAIQuestion(q,item.index));next[item.index]={q:fixed,issues:validateAIQuestion(fixed),index:item.index,blueprint:b};});
                        setPreview(next); setStatus(`Regenerasi selesai. ${next.filter(x=>x.issues.length).length} butir masih perlu ditinjau.`); return;
                    }
                    setTkaAiKey(apiKey.trim());
                    const repaired=[];
                    for(let n=0;n<invalid.length;n++){
                        const item=invalid[n], b=blueprint[item.index];

                                <button onClick={onLogout} className="w-full bg-white border border-gray-300 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-50 transition flex items-center justify-center gap-2"><LogOut size={18}/> Ganti Akun / Keluar</button>

                try {
                    if (isRegistering) {
                        await createUserWithEmailAndPassword(auth, email, password);

            const mergeBankCache = (cloudItems) => {
                const cloud = Array.isArray(cloudItems) ? cloudItems : [];

                setSavedExams(cloud);

            const [results, setResults] = useState([]);
            const [isGeneratorOpen, setIsGeneratorOpen] = useState(false);
            const [isTryoutGeneratorOpen, setIsTryoutGeneratorOpen] = useState(false);

            useEffect(() => {
                if (!user) return;
                
                // 1. Pulihkan Bank Soal dari cache lokal terlebih dahulu, kemudian sinkronkan dengan Firestore.

                if (cachedBank.length) setSavedExams(cachedBank);

                const qExams = query(collection(db, 'artifacts', appId, 'users', user.uid, 'exams'));

                        .map(snap => ({ id: snap.id, ...snap.data() }))

                        .sort((a, b) => String(b.publishedAt || '').localeCompare(String(a.publishedAt || '')));
