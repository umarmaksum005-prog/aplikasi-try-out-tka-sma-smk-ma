                    setActiveExam(null);
                });

                return () => { unsubExams(); unsubActive(); };
            }, [user]);

            // 3. Fetch Results (Optimized: Only when an exam is ACTIVE and view is RESULTS)
           useEffect(() => {
                if (!user) {
                    setResults([]);
                    return;
                }

               const qResults = query(collection(db, 'artifacts', appId, 'public', 'data', 'exam_results'));

                const unsubResults = onSnapshot(qResults, (snapshot) => {
                    const allResults = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                    // ✅ FILTER berdasarkan guru (bukan ujian aktif)
                    const myResults = allResults.filter(r => r.teacherId === user.uid);

                    setResults(myResults);
                }, (e) => console.log("Results Fetch Error:", e));

                return () => unsubResults();
            }, [user]);

            const getQuestionValidation = (items) => items.flatMap((q, i) => validateTKAQuestion(q).map(msg => `Soal ${i+1}: ${msg}`));

            const handleDeleteResults = async (examResults, examTitle = "Tanpa Nama Ujian") => {
                const group = Array.isArray(examResults) ? examResults : [];
                if (!group.length) {
                    alert(`Belum ada Rekap Nilai untuk ujian "${examTitle}" yang dapat dihapus.`);
                    return;
                }
                const confirmed = window.confirm(
                    `Hapus Rekap Nilai hanya untuk ujian "${examTitle}"?\n\nJumlah data: ${group.length} siswa.\n\nData ujian lain tidak akan ikut terhapus.\nData yang dihapus tidak dapat dipulihkan.`
                );
                if (!confirmed) return;
                try {
                    await Promise.all(group.map((item) => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'exam_results', item.id))));
                    setResults(prev => prev.filter(item => !group.some(g => g.id === item.id)));
                    alert(`Rekap Nilai untuk ujian "${examTitle}" berhasil dihapus.`);
                } catch (e) {
                    console.error("Delete Results Error:", e);
                    alert("Gagal menghapus Rekap Nilai: " + e.message);
                }
            };
            const handleSaveToBank = async () => {
                const validation = getQuestionValidation(questions); if (validation.length) return alert('Bank Soal belum memenuhi kontrol TKA:\n\n' + validation.slice(0,12).join('\n'));
                if (!examTitle.trim()) return alert("Gagal Menyimpan: Judul ujian tidak boleh kosong.");
                if (questions.length === 0) return alert("Gagal Menyimpan: Anda belum menambahkan soal satupun.");
                const examData = { title: examTitle, duration: examDuration, questions: questions, lastModified: new Date().toLocaleString(), author: user.email };
                try {
                    let savedItem;
                    if (currentExamId) {
                        const targetRef = doc(db, 'artifacts', appId, 'users', user.uid, 'exams', currentExamId);
                        await setDoc(targetRef, examData, { merge: true });
                        savedItem = { id: currentExamId, ...examData };
                    } else {
                        const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'exams'), examData);
                        setCurrentExamId(docRef.id);
                        savedItem = { id: docRef.id, ...examData };
                    }
                    // Backup lokal per akun. Data tetap tersedia setelah browser/file dibuka kembali.
                    const existing = readBankCache().filter(x => x.id !== savedItem.id);
                    writeBankCache([...existing, savedItem]);
                    alert("Berhasil disimpan ke Bank Soal Cloud dan dicadangkan di perangkat ini.");
                } catch (e) {
                    // Jika Firestore gagal, tetap simpan salinan lokal agar paket tidak hilang dari Editor/Bank lokal.
                    try {
                        const localId = currentExamId || `local-${Date.now()}`;
                        const localItem = { id: localId, ...examData, localOnly: true };
                        const existing = readBankCache().filter(x => x.id !== localId);
                        writeBankCache([...existing, localItem]);
                        setSavedExams([...existing, localItem]);
                        if (!currentExamId) setCurrentExamId(localId);
                        alert("Firestore gagal menyimpan, tetapi paket soal sudah dicadangkan secara lokal.\n\n" + firebaseErrorText(e));
                    } catch (localError) {
                        alert("Gagal menyimpan Bank Soal: " + e.message);
                    }
                }
            };

            const firebaseErrorText = (e) => {
                const code = e?.code || '';
                const detail = e?.message || String(e);
                if (code.includes('permission-denied')) return 'Akses Firestore ditolak (permission-denied). Periksa Firestore Security Rules untuk jalur public/data/active_exams.';
                if (code.includes('unauthenticated')) return 'Sesi login Firebase belum aktif. Silakan keluar lalu masuk kembali sebagai guru.';
                if (code.includes('unavailable')) return 'Firestore tidak tersedia sementara atau koneksi internet bermasalah. Coba lagi.';
                if (code.includes('failed-precondition')) return 'Konfigurasi Firestore belum siap (failed-precondition). Periksa database Firestore pada project Firebase.';
                return `${detail}${code ? ` [${code}]` : ''}`;
            };

            const makeToken = () => Math.random().toString(36).slice(2, 8).toUpperCase();

            const publishExam = async () => {
                const validation = getQuestionValidation(questions);
                if (validation.length) return alert('Ujian belum dapat diterbitkan karena ada butir yang belum memenuhi kontrol TKA:\n\n' + validation.slice(0,12).join('\n'));
                if (!examTitle.trim()) return alert("Gagal Menerbitkan: Judul Ujian tidak boleh kosong.");
                if (questions.length === 0) return alert("Gagal Menerbitkan: Anda belum menambahkan soal satupun.");
                if (!auth.currentUser || auth.currentUser.uid !== user?.uid) return alert('Gagal Menerbitkan: sesi login guru belum aktif. Silakan masuk kembali.');

                const activeTokenKey = `tka_active_token_${appId}_${user.uid}`;
                try {
                    // Cari token yang belum dipakai agar tidak menimpa sesi lain.
                    let token = '';
                    let targetRef = null;
                    for (let attempt = 0; attempt < 5; attempt++) {
                        const candidate = makeToken();
                        const candidateRef = doc(db, 'artifacts', appId, 'public', 'data', 'active_exams', candidate);
                        const existing = await getDoc(candidateRef);
                        if (!existing.exists()) { token = candidate; targetRef = candidateRef; break; }
                    }
                    if (!targetRef) throw new Error('Tidak dapat membuat token unik. Silakan coba lagi.');

                    const examData = {
                        title: examTitle.trim(),
                        duration: Number(examDuration) || 60,
                        questions: JSON.parse(JSON.stringify(questions)),
                        token,
                        teacherId: user.uid,
                        status: 'active',
                        publishedAt: new Date().toISOString()
                    };

                    await setDoc(targetRef, examData);
                    localStorage.setItem(activeTokenKey, token);
                    setActiveExam(examData);
                    setActiveExams(prev => [examData, ...prev.filter(item => item.token !== examData.token)]);
                    alert(`Ujian Diterbitkan Online!\n\nTOKEN: ${token}\n\nSiswa dapat masuk menggunakan token tersebut.`);
                } catch (e) {
                    console.error('Publish Exam Error:', e);
                    alert('Gagal menerbitkan token.\n\n' + firebaseErrorText(e) + '\n\nJika muncul permission-denied, Security Rules Firebase perlu mengizinkan guru terautentikasi membuat/membaca dokumen active_exams.');
                }
            };

            const handleCloseExam = async () => {
                if (!activeExam) { setShowCloseConfirm(false); return; }
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'active_exams', activeExam.token));
                    localStorage.removeItem(`tka_active_token_${appId}_${user.uid}`);
                    setActiveExam(null);
                    setActiveExams(prev => prev.filter(item => item.token !== activeExam.token));
                } catch (e) {
                    alert('Gagal menutup ujian: ' + firebaseErrorText(e));
                }
                setShowCloseConfirm(false);
            };

            const handleLoadFromBank = (exam) => {
                const safeQuestions = exam.questions || [];
                if (questions.length > 0 && !window.confirm("Editor sedang berisi soal. Timpa dengan data dari Bank Soal?")) return;

                const soalAcak = shuffleArray(JSON.parse(JSON.stringify(safeQuestions)));

                setExamTitle(exam.title); 
                setExamDuration(exam.duration); 
                setQuestions(soalAcak.map(q => ({ ...q, examTitle: exam.title }))); 
                setCurrentExamId(exam.id); 
                setDashboardView('editor');
            };

            const handleDeleteFromBank = async (id) => {
                if (!window.confirm("Hapus dari Bank Soal?")) return;
                try {
                    // Hapus cache lokal lebih dulu agar daftar langsung konsisten.
                    const remaining = readBankCache().filter(x => x.id !== id);
                    writeBankCache(remaining);
                    setSavedExams(remaining);
                    // ID lokal tidak ada di Firestore.
                    if (!String(id).startsWith('local-')) {
                        await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'exams', id));
                    }
                    if (currentExamId === id) setCurrentExamId(null);
                } catch (e) {
                    alert('Gagal menghapus dari Bank Soal: ' + firebaseErrorText(e));
                }
            };
            const handleAddQuestion = () => { setEditingItem(null); setIsEditorOpen(true); };
            const handleEditQuestion = (q) => { setEditingItem(q); setIsEditorOpen(true); };
            const handleDeleteQuestion = (id) => { if (window.confirm("Yakin ingin menghapus soal ini?")) setQuestions(questions.filter(q => q.id !== id)); };
            const loadTemplate = () => { 
                if (questions.length > 0 && !window.confirm("Menimpa soal yang sudah ada?")) return; 
                
                const soalAcak = shuffleArray(JSON.parse(JSON.stringify(TKA_TEMPLATE_DATA)));

                setQuestions(soalAcak.map(q => ({ ...q, examTitle: "Latihan Soal TKA (Standar BSKAP)" }))); 
                setExamTitle("Latihan Soal TKA (Standar BSKAP)"); 
                setCurrentExamId(null);  
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-10">
                    {isGeneratorOpen && (<QuestionGenerator onGenerate={(generated) => { const titled = generated.map(q => ({ ...q, examTitle: examTitle.trim() || q.examTitle || 'Tanpa Judul' })); setQuestions(prev => [...prev, ...titled]); setIsGeneratorOpen(false); setDashboardView('editor'); }} onCancel={() => setIsGeneratorOpen(false)} />)}
                    {isTryoutGeneratorOpen && (<TryoutGenerator onGenerate={(generated) => { const titled = generated.map(q => ({ ...q, examTitle: examTitle.trim() || q.examTitle || 'Tryout TKA SMA/SMK' })); setQuestions(prev => [...prev, ...titled]); setIsTryoutGeneratorOpen(false); setDashboardView('editor'); }} onCancel={() => setIsTryoutGeneratorOpen(false)} />)}
                    <ConfirmationModal isOpen={showCloseConfirm} title="Tutup Ujian?" message="Apakah Anda yakin ingin menutup sesi ujian ini? Siswa tidak akan bisa mengakses soal lagi setelah ditutup." confirmText="Ya, Tutup" isDanger={true} onConfirm={handleCloseExam} onCancel={() => setShowCloseConfirm(false)} />
                    {isEditorOpen && (<QuestionEditor initialData={editingItem} onSave={(qData) => { const titledData = { ...qData, examTitle: examTitle.trim() || qData.examTitle || 'Tanpa Judul' }; if (editingItem) setQuestions(questions.map(q => q.id === qData.id ? titledData : q)); else setQuestions([...questions, titledData]); setIsEditorOpen(false); }} onCancel={() => setIsEditorOpen(false)} />)}
                    <nav className="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-20"><div className="flex items-center gap-4"><h1 className="font-bold text-xl flex items-center gap-2"><School /> Dashboard Guru <span className="text-xs bg-indigo-800 px-2 py-1 rounded font-normal ml-2 hidden md:inline-block">{user.email}</span></h1><div className="hidden lg:flex flex-col text-[11px] font-bold leading-tight max-w-[430px]" style={{color:"#FFD700"}}><span>Aplikasi ini dikembangkan oleh <a href="https://www.facebook.com/umar.maksum.56" target="_blank" rel="noopener noreferrer" style={{color:"#FFD700", textDecoration:"none"}}>Umar Maksum</a>.</span><span>Aplikasi ini tidak diperjualbelikan. Saran dan pertanyaan disampaikan ke: <a href="https://www.facebook.com/umar.maksum.56" target="_blank" rel="noopener noreferrer" style={{color:"#FFD700", textDecoration:"none"}}>https://www.facebook.com/umar.maksum.56</a></span></div></div><div className="flex gap-3"><button onClick={() => setDashboardView('editor')} className={`px-3 py-1 rounded text-sm font-bold transition ${dashboardView === 'editor' ? 'bg-white text-indigo-700' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-600'}`}>Editor Soal</button><button onClick={() => setDashboardView('bank')} className={`px-3 py-1 rounded text-sm font-bold transition ${dashboardView === 'bank' ? 'bg-white text-indigo-700' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-600'}`}>Bank Soal</button><button onClick={() => setDashboardView('results')} className={`px-3 py-1 rounded text-sm font-bold transition ${dashboardView === 'results' ? 'bg-white text-indigo-700' : 'bg-indigo-800 text-indigo-200 hover:bg-indigo-600'}`}>Hasil & Nilai</button><button onClick={onLogout} className="flex items-center gap-1 bg-red-600 px-3 py-1 rounded hover:bg-red-700 text-sm ml-4"><LogOut size={16}/> Keluar</button></div></nav>
                    <main className="max-w-6xl mx-auto p-6 space-y-6">
                        {dashboardView === 'editor' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200"><h2 className="text-lg font-semibold mb-4 text-gray-700">Status Publikasi</h2>{activeExams.length > 0 ? (<div className="space-y-3">{activeExams.map(exam => (<div key={exam.token || exam.id} className="bg-green-50 border border-green-200 rounded-lg p-4 flex flex-col md:flex-row md:justify-between md:items-center gap-3"><div><p className="font-bold text-green-800 text-lg">{exam.title || 'Tanpa Judul'}</p><p className="text-sm text-green-700 mt-1">Token: <span className="font-mono font-bold">{exam.token}</span> | {(exam.questions || []).length} Soal</p><p className="text-xs text-green-700 mt-1">Dipublikasikan: {exam.publishedAt ? new Date(exam.publishedAt).toLocaleString('id-ID') : 'Tanggal tidak tersedia'}</p></div><button onClick={() => { setActiveExam(exam); setShowCloseConfirm(true); }} className="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 text-sm font-bold">Tutup Ujian</button></div>))}</div>) : (<div className="bg-gray-100 border border-gray-200 rounded-lg p-4 text-center text-gray-500">Belum ada ujian aktif. Klik "Terbitkan Token" untuk memulai sesi ujian.</div>)}</div>
                                
                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                    <div className="p-6 border-b bg-gray-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <div>
                                            <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2"><FileEdit size={20}/> {currentExamId ? 'Mode Edit Ujian' : 'Editor Soal Baru'}</h2>
                                            <p className="text-sm text-gray-500">Buat paket soal baru atau edit dari Bank Soal.</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setIsGeneratorOpen(true)} className="text-sm bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded flex items-center gap-2 font-bold">⚙️ Generate Soal</button><button onClick={() => setIsTryoutGeneratorOpen(true)} className="text-sm bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded flex items-center gap-2 font-bold">📝 Generate Tryout TKA</button><button onClick={loadTemplate} className="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded flex items-center gap-2"><Layers size={16}/> Template TKA</button>
                                            <button onClick={handleSaveToBank} className="text-sm bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-2 rounded flex items-center gap-2 font-bold"><Save size={16}/> Simpan ke Bank Soal</button><button onClick={() => downloadWordQuestions(questions, examTitle.trim() || 'TKA_SD')} disabled={!questions.length} className="text-sm bg-purple-100 hover:bg-purple-200 text-purple-700 disabled:opacity-50 disabled:cursor-not-allowed px-3 py-2 rounded flex items-center gap-2 font-bold"><FileText size={16}/> Unduh Word + Kisi-Kisi</button>
                                        </div>
                                    </div>
                                    <div className="p-6 space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Judul Ujian <span className="text-red-500">*</span></label>
                                                <input type="text" value={examTitle} onChange={(e) => setExamTitle(e.target.value)} className="w-full p-2 border rounded-lg outline-none focus:border-blue-500" placeholder="Contoh: Try Out TKA 1" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">Durasi (Menit) <span className="text-red-500">*</span></label>
                                                <input type="number" value={examDuration} onChange={(e) => setExamDuration(e.target.value)} className="w-full p-2 border rounded-lg outline-none focus:border-blue-500" />
                                            </div>
                                        </div>
                                        
                                        <div className="border rounded-xl overflow-hidden shadow-sm">
                                            <div className="bg-gray-100 p-3 font-bold text-gray-700 border-b flex flex-col md:flex-row md:justify-between md:items-center gap-3">
                                                <span className="flex items-center gap-2"><List size={18}/> Daftar Soal ({questions.length})</span>
                                                <button onClick={() => { setEditingItem(null); setIsEditorOpen(true); }} className="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 hover:bg-blue-700"><Plus size={16}/> Tambah Soal Baru</button>
                                            </div>
                                            <div className="p-3 bg-white border-b space-y-3">
                                      <div className="flex flex-wrap gap-2 items-center">
                                          <span className="text-sm font-semibold text-gray-600">Mata Pelajaran:</span>
                                          <button onClick={() => { setEditorSubjectFilter('Semua'); setEditorTitleFilter('Semua Judul'); }} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition ${editorSubjectFilter === 'Semua' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`}>Semua ({questions.length})</button>
                                          <button onClick={() => { setEditorSubjectFilter('Bahasa Indonesia'); setEditorTitleFilter('Semua Judul'); }} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition ${editorSubjectFilter === 'Bahasa Indonesia' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-blue-700 border-blue-200 hover:bg-blue-50'}`}>Bahasa Indonesia ({questions.filter(q => q.subject === 'Bahasa Indonesia').length})</button>
                                          <button onClick={() => { setEditorSubjectFilter('Matematika'); setEditorTitleFilter('Semua Judul'); }} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition ${editorSubjectFilter === 'Matematika' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-white text-emerald-700 border-emerald-200 hover:bg-emerald-50'}`}>Matematika ({questions.filter(q => q.subject === 'Matematika').length})</button>
                                      </div>
                                      <div className="flex flex-wrap gap-2 items-center">
                                          <span className="text-sm font-semibold text-gray-600">Judul Soal:</span>
                                          {(() => {
                                              const titleSource = editorSubjectFilter === 'Semua' ? questions : questions.filter(q => q.subject === editorSubjectFilter);
                                              const titles = [...new Set(titleSource.map(q => String(q.examTitle || examTitle || 'Tanpa Judul').trim() || 'Tanpa Judul'))];
                                              return (
                                                  <>
                                                      <button onClick={() => setEditorTitleFilter('Semua Judul')} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition ${editorTitleFilter === 'Semua Judul' ? 'bg-gray-800 text-white border-gray-800' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'}`}>Semua Judul</button>
                                                      {titles.map(title => (
                                                          <button key={title} onClick={() => setEditorTitleFilter(title)} title={title} className={`px-3 py-1.5 rounded-full text-xs font-bold border transition max-w-xs truncate ${editorTitleFilter === title ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-amber-700 border-amber-200 hover:bg-amber-50'}`}>
                                                              {title}
                                                          </button>
                                                      ))}
                                                  </>
                                              );
                                          })()}
                                      </div>
                                  </div>
                                  <div className="bg-white divide-y max-h-[500px] overflow-y-auto">
                                                {(() => {
                                                    const subjectsToShow = editorSubjectFilter === 'Semua'
                                                        ? TKA_META.subjects
                                                        : [editorSubjectFilter];
                                                    const renderQuestion = (q, displayNo) => (
                                                        <div key={q.id} className="p-4 hover:bg-gray-50 group relative">
                                                            <div className="flex items-center gap-2 mb-2 flex-wrap">
                                                                <span className="font-bold text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded">No. {displayNo}</span>
                                                                <span className={`font-bold text-xs px-2 py-0.5 rounded uppercase ${q.type === 'single' ? 'bg-blue-100 text-blue-700' : q.type === 'complex' ? 'bg-purple-100 text-purple-700' : 'bg-orange-100 text-orange-700'}`}>{q.type === 'single' ? 'PG Sederhana' : q.type === 'complex' ? 'PGK MCMA' : 'PGK Kategori'}</span>
                                                                {q.cognitiveLevel && <span className="text-xs px-2 py-0.5 rounded bg-yellow-100 text-yellow-800 border border-yellow-200 font-semibold">{q.cognitiveLevel}</span>}
                                                                {q.itemType && <span className="text-xs px-2 py-0.5 rounded bg-green-100 text-green-700 border border-green-200">{q.itemType}</span>}
                                                            </div>
                                                            {q.image && <img src={q.image} alt="Thumbnail" className="h-12 w-auto object-contain border rounded mb-2" />}
                                                            <p className="text-gray-800 font-medium mb-1 whitespace-pre-wrap text-sm line-clamp-2">{q.text}</p>
                                                            <div className="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                <button onClick={() => { setEditingItem(q); setIsEditorOpen(true); }} className="p-1.5 bg-blue-50 text-blue-600 rounded hover:bg-blue-100"><Edit3 size={16}/></button>
                                                                <button onClick={() => { if(window.confirm("Hapus?")) setQuestions(questions.filter(qi => qi.id !== q.id)) }} className="p-1.5 bg-red-50 text-red-600 rounded hover:bg-red-50"><Trash2 size={16}/></button>
                                                            </div>
                                                        </div>
                                                    );
                                                    let runningNo = 0;
                                                    const sections = subjectsToShow.map(subjectName => {
                                                        const subjectQuestions = questions
                                                             .filter(q => q.subject === subjectName)
                                                             .filter(q => editorTitleFilter === 'Semua Judul' || String(q.examTitle || examTitle || 'Tanpa Judul').trim() === editorTitleFilter);
                                                        if (!subjectQuestions.length) return null;
                                                        const titleGroups = subjectQuestions.reduce((groups, q) => {
                                                            const title = String(q.examTitle || examTitle || 'Tanpa Judul').trim() || 'Tanpa Judul';
                                                            if (!groups[title]) groups[title] = [];
                                                            groups[title].push(q);
                                                            return groups;
                                                        }, {});
                                                        const titleEntries = Object.entries(titleGroups);
                                                        const titleClass = subjectName === 'Bahasa Indonesia'
                                                            ? 'bg-blue-50 text-blue-800 border-blue-200'
                                                            : 'bg-emerald-50 text-emerald-800 border-emerald-200';
                                                        return (
                                                            <div key={subjectName}>
                                                                <div className={`px-4 py-2.5 font-extrabold text-sm border-b ${titleClass}`}>
                                                                    {subjectName} <span className="font-semibold">({subjectQuestions.length} soal)</span>
                                                                </div>
                                                                {titleEntries.map(([title, titleQuestions]) => (
                                                                    <div key={`${subjectName}-${title}`} className="border-b last:border-b-0">
                                                                        <div className="px-5 py-2 bg-gray-50 text-gray-700 text-xs font-extrabold uppercase tracking-wide border-b flex items-center justify-between gap-2">
                                                                            <span className="truncate">Judul Soal: {title}</span>
                                                                            <div className="flex items-center gap-2 flex-shrink-0">
                                                                                <span className="font-semibold text-gray-500">{titleQuestions.length} soal</span>
                                                                                <button onClick={() => downloadWordQuestions(titleQuestions, title)} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-purple-100 text-purple-700 hover:bg-purple-200 normal-case font-bold" title={`Unduh Word ${title}`}>

                };

                document.addEventListener("fullscreenchange", handleFullscreenChange);
                document.addEventListener("visibilitychange", handleVisibility);
                return () => {
                    document.removeEventListener("fullscreenchange", handleFullscreenChange);
                    document.removeEventListener("visibilitychange", handleVisibility);
                };

            const forceFullscreen = () => {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.warn("Fullscreen API diblokir oleh browser:", err);

                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.log("Auto-login failed:", e);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                });
                return () => unsubscribe();
            }, []);

            // PERBAIKAN FUNGSI LOGOUT (Pindah halaman dulu, baru signout)
            const handleLogout = async () => {
                // 1. Pindah ke Landing Page TERLEBIH DAHULU
                setView('landing'); 
                
                // 2. Bersihkan data sesi
                setStudentData(null);
                setResultData(null);
                setActiveExamData(null);

                // 3. Lakukan proses Sign Out dan Re-login Anonymous di background
                try {
                    await signOut(auth);
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth); 
                    }
                } catch (error) {
                    console.error("Logout error:", error);
                }
            };

            const handleTeacherEntry = (mode = 'login') => {
                 setAuthMode(mode);
                 setView('auth');
            };

            return (
                <>
                    {view === 'landing' && (
                        <LandingPage 
                            onRoleSelect={(role, mode) => {
                                if (role === 'teacher') handleTeacherEntry(mode);
                                else setView('student');
                            }} 
                        />
                    )}

                    {view === 'auth' && (
                        <AuthPage 
                            initialMode={authMode}
                            user={user}
                            onContinue={() => setView('teacher')}
                            onLogout={handleLogout}
                        />
                    )}
       
                    {view === 'student' && (
                        <StudentLogin 
                            onStartExam={(sData, examData) => {
                                setStudentData(sData);
                                setActiveExamData(examData);
                                setView('exam');
                                const elem = document.documentElement;
                                if (elem.requestFullscreen) {
                                    elem.requestFullscreen().catch(err => console.warn("Fullscreen diblokir:", err));
                                }
                            }} 
                            onBack={() => setView('landing')}
                        />
                    )}
                    
                    {view === 'teacher' && user && !user.isAnonymous && (
                        <TeacherDashboard 
                            user={user} 
                            onLogout={handleLogout} 
                        />
                    )}

                    {/* Loading/Fallback State */}
                    {view === 'teacher' && (!user || user.isAnonymous) && (
                         <div className="flex flex-col items-center justify-center h-screen bg-gray-100 text-gray-600">
                            <Loader2 className="animate-spin mb-2" size={32}/>
                            <p>Memuat sesi guru...</p>
                            {setTimeout(() => { if(!user || user.isAnonymous) setView('auth'); }, 2000) && ""}
                         </div>
                    )}

                    {view === 'login' && (
                        <StudentLogin 
                            onBack={() => setView('landing')} 
                            onStartExam={(sData, examData) => {
                                setStudentData(sData);
                                setActiveExamData(examData);
                                setView('exam');
                                
                                // --- FITUR FULLSCREEN ---
                                const elem = document.documentElement;
                                if (elem.requestFullscreen) {
                                    elem.requestFullscreen().catch(err => console.warn("Fullscreen diblokir:", err));
                                }
                            }} 
                        />
                    )}
                   
                    {view === 'exam' && activeExamData && studentData && (
                        <ExamInterface 
                            examData={activeExamData} 
                            studentData={studentData} 
                            onFinish={(res) => {
                                setResultData(res);
                                setView('result');
                                
                                // --- KELUAR DARI FULLSCREEN ---
                                if (document.fullscreenElement && document.exitFullscreen) {
                                    document.exitFullscreen().catch(err => console.warn("Exit Fullscreen diblokir:", err));
                                }
                            }} 
                        />
                    )}
                    
                    {view === 'result' && resultData && (
                        <ResultView 
                            result={resultData} 
                            onLogout={() => {
                                setView('landing');
                                setStudentData(null);
                                setActiveExamData(null);
                            }} 
                        />
                    )}
                </>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
